version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # PR titles must be Conventional Commits (they become the squashed commit).
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Crates that must move together: md-5 and blake2 implement digest's
      # traits, as does the ring SHA-256 adapter in
      # crates/dogfish/src/tools/checksum.rs, so a lone bump never compiles.
      rustcrypto:
        patterns: ["digest", "md-5", "blake2", "sha2"]
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    # Every action is pinned to a full commit SHA with its version in a
    # comment (`uses: owner/action@<sha> # v1.2.3`); Dependabot updates both.
    ignore:
      # dtolnay/rust-toolchain has no releases: it is pinned to a commit of its
      # master branch, and the toolchains are its `toolchain:` inputs (1.88.0
      # is the MSRV, the Clippy and release pins are deliberate). Bump by hand.
      - dependency-name: "dtolnay/rust-toolchain"
