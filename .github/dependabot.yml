version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # PR titles must be Conventional Commits (they become the squashed commit).
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Crates that must move together: digest's traits are implemented by md-5,
      # blake2 and the ring adapter in hash.rs, so a lone bump never compiles.
      rustcrypto:
        patterns: ["digest", "md-5", "blake2", "sha2"]
      cargo-minor:
        update-types: [minor, patch]
    ignore:
      # digest 0.11 / blake2 0.11 / md-5 0.11 need a hand-written port (no
      # Blake2bVar, no md-5 asm feature, new digest traits for the ring
      # adapter): cairn item 0015. Remove this when it lands.
      - dependency-name: "digest"
        versions: [">=0.11"]
      - dependency-name: "blake2"
        versions: [">=0.11"]
      - dependency-name: "md-5"
        versions: [">=0.11"]
      - dependency-name: "sha2"
        versions: [">=0.11"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    # Every action is pinned to a full commit SHA with its version in a
    # comment (`uses: owner/action@<sha> # v1.2.3`); Dependabot updates both.
    ignore:
      # dtolnay/rust-toolchain has no releases: it is pinned to a commit of its
      # master branch, and the toolchains are its `toolchain:` inputs (1.88.0
      # is the MSRV, the Clippy and release pins are deliberate). Bump by hand.
      - dependency-name: "dtolnay/rust-toolchain"
