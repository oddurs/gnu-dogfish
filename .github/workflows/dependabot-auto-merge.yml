name: Dependabot Auto-Merge

# Queues GitHub auto-merge (squash) on Dependabot PRs for patch and minor updates;
# GitHub merges them only once the required CI checks pass. Major updates are left
# for a human. Requires "Allow auto-merge" and a branch protection rule on main that
# requires the CI checks (otherwise auto-merge has nothing to wait for).

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch and minor updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
