name: GNU Test Suite

# Runs GNU coreutils' own test suite against Dogfish (util/gnu-tests.sh) and
# fails on any test that passed in util/gnu-baseline.json and no longer does.
# The pass rate and per-program breakdown appear in the job summary.

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "util/gnu-tests.sh"
      - "util/gnu_tests.py"
      - "util/gnu-baseline.json"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - ".github/workflows/gnu-tests.yml"
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gnu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      # The built GNU tree depends only on the pinned release.
      - name: Cache GNU coreutils build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/gnu/coreutils-9.4
          key: gnu-coreutils-9.4-${{ runner.os }}-v1

      - name: Run GNU's test suite against Dogfish
        run: cargo xtask gnu

      - name: Print passing tests (for updating the baseline)
        if: always()
        run: |
          python3 -I - <<'EOF'
          import json, os, sys
          if not os.path.exists("target/gnu/gnu-results.json"):
              sys.exit("no results: the run stopped before any test ran")
          r = json.load(open("target/gnu/gnu-results.json"))
          passing = sorted(t for t, v in r["tests"].items() if v["result"] in ("PASS", "XFAIL"))
          print("::group::gnu-baseline.json")
          print(json.dumps({"gnu_version": "coreutils-9.4", "pass": passing}, indent=1))
          print("::endgroup::")
          EOF

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gnu-test-results
          path: |
            target/gnu/gnu-results.json
            target/gnu/gnu-summary.md
            target/gnu/selection.json
            target/gnu/check.log
            target/gnu/coreutils-9.4/tests/**/*.log
            target/gnu/coreutils-9.4/tests/**/*.trs
          if-no-files-found: warn
