name: PR Title

# PRs are squash-merged, so the PR title becomes the commit on main that
# release-please reads: it must be a Conventional Commit (`feat: ...`, `fix(cp): ...`).

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      # Only reads the title through the API; never checks out or runs PR code.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
