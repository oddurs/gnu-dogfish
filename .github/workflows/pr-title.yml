name: PR Title

# PRs are squash-merged, so the PR title becomes the commit on main that
# release-please reads: it must be a Conventional Commit (`feat: ...`, `fix(cp): ...`).

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Only reads the title through the API; never checks out or runs PR code.
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
