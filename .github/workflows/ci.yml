name: CI (macOS & Linux)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Platform-specific code (macOS clonefile/getmntinfo, Linux FICLONE) only
        # type-checks and lints on its own OS.
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Pinned so a new stable Clippy lint cannot turn unrelated PRs red; bump deliberately.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Docs
        if: runner.os == 'Linux'
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Package (crates.io dry run)
        if: runner.os == 'Linux'
        run: cargo package --workspace --locked

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Debug builds keep clap's argument-definition asserts and overflow checks on,
      # which catch bugs that release builds silently ignore.
      - name: Test (debug)
        run: cargo test --workspace --locked

      - name: Test (release)
        run: cargo test --workspace --release --locked

      # Smoke test only: shared CI runners are too noisy for meaningful timings.
      - name: Benchmark smoke test
        run: ./target/release/dogfish bench -n 1 -s 4

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Test
        run: cargo test --workspace --locked
