name: Release Binaries (macOS & Linux)

on:
  # A tag pushed by a person (or a token that triggers workflows).
  push:
    tags:
      - "v*.*.*"
  # Called by release-please.yml right after it tags a release: tags created with
  # GITHUB_TOKEN do not trigger the `push` event above.
  workflow_call:
    inputs:
      tag:
        description: Tag to build and upload assets for (e.g. v0.2.0)
        required: true
        type: string
  # Rebuild the assets of an existing tag by hand.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and upload assets for (e.g. v0.2.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Archive (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_name: gnu-dogfish-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_name: gnu-dogfish-macos-arm64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        run: cargo test --workspace --release --locked --target ${{ matrix.target }}

      # Built for the baseline CPU of the target (no `target-cpu=native`) so the
      # binaries run on any machine of that architecture.
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package release archive & SHA256SUMS
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/dogfish dist/
          cp README.md LICENSE LICENSE-GPL LICENSE-MIT CHANGELOG.md dist/
          tar -czf ${{ matrix.archive_name }} -C dist .
          ./target/${{ matrix.target }}/release/dogfish sha256sum ${{ matrix.archive_name }} > ${{ matrix.archive_name }}.sha256

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256
          # release-please writes the notes itself; only generate them for a hand-pushed tag.
          generate_release_notes: ${{ inputs.tag == '' }}
