name: Release Binaries (macOS & Linux)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Archive (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_name: gnu-dogfish-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_name: gnu-dogfish-macos-arm64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        run: cargo test --workspace --release --target ${{ matrix.target }}

      # Built for the baseline CPU of the target (no `target-cpu=native`) so the
      # binaries run on any machine of that architecture.
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release archive & SHA256SUMS
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/dogfish dist/
          cp README.md LICENSE LICENSE-GPL LICENSE-MIT CHANGELOG.md dist/
          tar -czf ${{ matrix.archive_name }} -C dist .
          ./target/${{ matrix.target }}/release/dogfish sha256sum ${{ matrix.archive_name }} > ${{ matrix.archive_name }}.sha256

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256
          generate_release_notes: true
