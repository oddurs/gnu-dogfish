<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" height="210">
  <!-- Classic 1994 X11 / PostScript off-white parchment box with double black border -->
  <rect x="4" y="4" width="632" height="202" fill="#f7f5eb" stroke="#000000" stroke-width="3" />
  <rect x="9" y="9" width="622" height="192" fill="none" stroke="#000000" stroke-width="1" />

  <!-- Woodcut / Ink-Pen Lockup of the Bearded, Horned Dogfish Head (Etienne Suvasa 1991 vibe) -->
  <g transform="translate(18, 16)" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left & Right GNU Horns growing out of the fish skull -->
    <path d="M 72 62 C 52 50, 22 44, 16 20 C 14 10, 26 6, 30 16 C 34 30, 56 32, 82 50 Z" fill="#e2dcc8" stroke-width="2.5" />
    <path d="M 105 58 C 122 42, 152 36, 156 14 C 158 5, 146 4, 142 14 C 138 28, 118 30, 94 50 Z" fill="#e2dcc8" stroke-width="2.5" />
    <!-- Horn ridges (cross-hatching lines) -->
    <line x1="25" y1="26" x2="34" y2="21" stroke-width="1.5" />
    <line x1="36" y1="35" x2="45" y2="28" stroke-width="1.5" />
    <line x1="50" y1="43" x2="58" y2="35" stroke-width="1.5" />
    <line x1="147" y1="22" x2="138" y2="18" stroke-width="1.5" />
    <line x1="136" y1="31" x2="127" y2="25" stroke-width="1.5" />
    <line x1="122" y1="39" x2="114" y2="32" stroke-width="1.5" />

    <!-- Spiny Dorsal Fin with awkward venomous spine sticking out -->
    <path d="M 65 55 L 55 15 L 63 18 L 78 52 Z" fill="#000000" />
    <path d="M 76 52 C 84 26, 102 28, 110 54 Z" fill="#c9c2af" stroke-width="2.5" />
    <line x1="86" y1="38" x2="84" y2="52" stroke-width="1.3" />
    <line x1="95" y1="39" x2="94" y2="52" stroke-width="1.3" />

    <!-- Lumpy, slightly derpy 90s Dogfish Head & Snout -->
    <path d="M 32 105 C 28 76, 56 50, 92 50 C 128 50, 158 74, 168 95 C 174 106, 156 116, 138 116 C 125 116, 112 126, 88 126 C 60 126, 35 118, 32 105 Z" fill="#ffffff" stroke-width="3" />

    <!-- Cross-hatching shading on the fish forehead -->
    <line x1="65" y1="60" x2="55" y2="72" stroke-width="1.2" />
    <line x1="75" y1="58" x2="63" y2="74" stroke-width="1.2" />
    <line x1="85" y1="58" x2="72" y2="75" stroke-width="1.2" />
    <line x1="95" y1="59" x2="84" y2="74" stroke-width="1.2" />
    <line x1="105" y1="61" x2="96" y2="73" stroke-width="1.2" />

    <!-- Big Bugged-Out Tired Hacker Eyes with bags under them + round wire spectacles -->
    <circle cx="76" cy="86" r="14" fill="#ffffff" stroke-width="2.5" />
    <circle cx="114" cy="86" r="14" fill="#ffffff" stroke-width="2.5" />
    <!-- Spectacle bridge & earpieces -->
    <path d="M 90 84 C 95 80, 95 80, 100 84" fill="none" stroke-width="2.5" />
    <line x1="62" y1="84" x2="42" y2="78" stroke-width="2" />
    <line x1="128" y1="84" x2="148" y2="78" stroke-width="2" />
    <!-- Pupils looking slightly cross-eyed at a parentheses mismatch -->
    <circle cx="80" cy="86" r="4" fill="#000000" />
    <circle cx="110" cy="86" r="4" fill="#000000" />
    <!-- Tired bags under eyes -->
    <path d="M 66 96 C 72 101, 82 101, 86 96" fill="none" stroke-width="1.3" />
    <path d="M 104 96 C 110 101, 120 101, 124 96" fill="none" stroke-width="1.3" />

    <!-- Grumpy Fish Mouth & Sawtooth Shark Teeth -->
    <path d="M 64 114 C 82 107, 114 107, 134 115" fill="none" stroke-width="2.5" />
    <polyline points="72,112 76,118 80,111 85,118 90,110 95,118 100,110 105,118 110,111 115,118 120,112" fill="none" stroke-width="1.8" />

    <!-- 5 Gill Slits on the left cheek -->
    <line x1="42" y1="92" x2="40" y2="108" stroke-width="2" />
    <line x1="47" y1="93" x2="45" y2="109" stroke-width="2" />
    <line x1="52" y1="94" x2="50" y2="110" stroke-width="2" />

    <!-- Tangled, Unkempt Stallman/GNU Beard hanging from the fish chin -->
    <path d="M 55 118 C 46 138, 52 162, 64 172 C 62 158, 66 148, 70 144 C 68 158, 76 174, 88 178 C 86 164, 90 152, 94 146 C 96 162, 104 174, 116 176 C 114 162, 116 150, 120 144 C 124 158, 132 168, 140 166 C 144 150, 142 132, 132 116 Z" fill="#ffffff" stroke-width="2.5" />
    <!-- Scraggly beard hair ink lines -->
    <path d="M 66 122 C 60 136, 62 150, 65 162" fill="none" stroke-width="1.4" />
    <path d="M 78 124 C 74 140, 78 156, 84 168" fill="none" stroke-width="1.4" />
    <path d="M 92 125 C 90 142, 94 156, 98 166" fill="none" stroke-width="1.4" />
    <path d="M 106 124 C 106 140, 110 154, 113 166" fill="none" stroke-width="1.4" />
    <path d="M 120 121 C 124 136, 128 148, 132 158" fill="none" stroke-width="1.4" />
  </g>

  <!-- Vertical Separator Rule (Classic Lockup) -->
  <line x1="206" y1="22" x2="206" y2="188" stroke="#000000" stroke-width="2" />

  <!-- Classic 1990s Times / Courier Lockup Typography -->
  <g transform="translate(222, 0)" fill="#000000">
    <text x="0" y="48" font-family="Georgia, 'Times New Roman', Times, serif" font-size="16" font-style="italic" letter-spacing="0.5">
      The Free Software Coreutils Project
    </text>

    <text x="0" y="102" font-family="Georgia, 'Times New Roman', Times, serif" font-size="50" font-weight="bold" letter-spacing="-1">
      GNU/Dogfish
    </text>

    <line x1="0" y1="118" x2="388" y2="118" stroke="#000000" stroke-width="1.5" />

    <text x="0" y="143" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold">
      Dogfish&apos;s Own Gnu-style File &amp; I/O SHell-tools
    </text>

    <text x="0" y="172" font-family="Georgia, 'Times New Roman', Times, serif" font-size="13.5">
      Copyleft (c) 1983, 2026 — &quot;Free as in Free Swimming&quot;
    </text>
  </g>
</svg>
