<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="sharkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#00bbf9" />
      <stop offset="100%" stop-color="#3a86ff" />
    </linearGradient>
    <linearGradient id="hornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffbe0b" />
      <stop offset="100%" stop-color="#fb5607" />
    </linearGradient>
  </defs>

  <!-- Background Banner -->
  <rect width="800" height="320" rx="20" fill="url(#bgGrad)" stroke="#00bbf9" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
  </g>

  <!-- Bearded GNU-horned Spiny Dogfish Emblem -->
  <g transform="translate(55, 45)">
    <!-- Outer Seal Ring (GNU-style Medallion) -->
    <circle cx="115" cy="115" r="105" fill="#090d16" stroke="url(#sharkGrad)" stroke-width="3" />
    <circle cx="115" cy="115" r="97" fill="none" stroke="#ffbe0b" stroke-width="1" stroke-dasharray="6,4" stroke-opacity="0.6" />

    <!-- Spiny Dorsal Fin + Classic Spine -->
    <path d="M 85 75 L 70 30 L 80 35 L 105 68 Z" fill="url(#hornGrad)" />
    <path d="M 92 72 C 95 40, 120 38, 135 72 Z" fill="url(#sharkGrad)" />

    <!-- Iconic GNU Curved Horns on the Dogfish Head! -->
    <path d="M 155 78 C 165 45, 195 38, 182 22 C 174 35, 152 42, 142 74 Z" fill="url(#hornGrad)" />
    <path d="M 145 75 C 148 48, 172 42, 165 26 C 158 38, 140 48, 134 74 Z" fill="url(#hornGrad)" opacity="0.85" />

    <!-- Sleek Dogfish Body & Tail -->
    <path d="M 28 115 L 5 80 L 22 105 L 48 108 C 85 70, 155 68, 198 105 C 175 130, 145 135, 110 132 C 80 130, 52 122, 28 115 L 8 148 L 24 120 Z" fill="url(#sharkGrad)" />

    <!-- Underbelly & Pectoral Fin -->
    <path d="M 75 124 C 115 136, 160 132, 192 108 C 165 118, 115 120, 75 124 Z" fill="#e2e8f0" />
    <path d="M 122 124 L 102 162 L 138 128 Z" fill="#00bbf9" />

    <!-- Fierce Hacker Eye & Gill Slits -->
    <circle cx="170" cy="98" r="4.5" fill="#090d16" />
    <circle cx="171.5" cy="96.5" r="1.8" fill="#ffbe0b" />
    <line x1="142" y1="96" x2="139" y2="112" stroke="#090d16" stroke-width="2.2" stroke-linecap="round" />
    <line x1="148" y1="97" x2="145" y2="113" stroke="#090d16" stroke-width="2.2" stroke-linecap="round" />
    <line x1="154" y1="98" x2="151" y2="114" stroke="#090d16" stroke-width="2.2" stroke-linecap="round" />

    <!-- Flowing RMS / GNU Hacker Beard under the Dogfish Chin! -->
    <path d="M 168 120 C 175 142, 165 168, 182 182 C 160 178, 154 160, 156 142 C 150 162, 142 175, 155 186 C 135 178, 134 152, 144 126 Z" fill="#cbd5e1" opacity="0.9" />

    <!-- Spiny Dogfish White Spots -->
    <circle cx="95" cy="96" r="2.2" fill="#ffffff" opacity="0.8" />
    <circle cx="112" cy="92" r="2.5" fill="#ffffff" opacity="0.8" />
    <circle cx="128" cy="96" r="2.0" fill="#ffffff" opacity="0.8" />
    <circle cx="78" cy="102" r="1.8" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Typography & Manifesto Header -->
  <g transform="translate(305, 95)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="bold" fill="#ffbe0b" letter-spacing="3">
      THE FREE SOFTWARE COREUTILS PROJECT
    </text>
    <text x="0" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="2">
      DOGFISH
    </text>
    <text x="0" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17" fill="#94a3b8">
      GNU/Dogfish: Libre, High-Velocity, Object-Aware Coreutils
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 118)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="bold">
      <rect x="0" y="0" width="118" height="28" rx="6" fill="#00f5d4" fill-opacity="0.15" stroke="#00f5d4" stroke-width="1"/>
      <text x="14" y="18" fill="#00f5d4">100% LIBRE</text>

      <rect x="130" y="0" width="142" height="28" rx="6" fill="#00bbf9" fill-opacity="0.15" stroke="#00bbf9" stroke-width="1"/>
      <text x="144" y="18" fill="#00bbf9">NDJSON PIPES</text>

      <rect x="284" y="0" width="150" height="28" rx="6" fill="#ffbe0b" fill-opacity="0.15" stroke="#ffbe0b" stroke-width="1"/>
      <text x="298" y="18" fill="#ffbe0b">ZERO-COPY CoW</text>
    </g>
  </g>
</svg>
