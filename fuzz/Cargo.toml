# Fuzz targets for Dogfish's parsers (cargo-fuzz layout; needs nightly).
#
#     cargo xtask fuzz [TARGET] [SECONDS]
#     cargo +nightly fuzz run TARGET corpus/TARGET seeds/TARGET -- -max_total_time=60
#
# Its own workspace, outside the main one, so `cargo xtask ci`, the MSRV check
# and cargo-deny never see it. (libfuzzer-sys is MIT OR Apache-2.0, with LLVM's
# libFuzzer under NCSA; none of it goes into a Dogfish release.)
[package]
name = "dogfish-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "GPL-3.0-or-later OR MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
dogfish = { path = "../crates/dogfish", features = ["fuzzing"] }
dogfish-core = { path = "../crates/dogfish-core" }

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "basenc"
path = "fuzz_targets/basenc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cut_list"
path = "fuzz_targets/cut_list.rs"
test = false
doc = false
bench = false

