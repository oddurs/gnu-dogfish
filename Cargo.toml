[workspace]
resolver = "2"
members = [
    "crates/dogfish-core",
    "crates/dogfish",
    "crates/xtask",
]
# Patched in only by `cargo xtask macos`; the fuzz targets are their own
# workspace (nightly only).
exclude = ["crates/xtask/ring-stub", "fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later OR MIT"
authors = ["The GNU/Dogfish Contributors"]
description = "GNU/Dogfish: Libre, high-velocity, object-aware coreutils in Rust"
repository = "https://github.com/oddurs/gnu-dogfish"
homepage = "https://github.com/oddurs/gnu-dogfish"
readme = "README.md"
keywords = ["coreutils", "cli", "unix", "ndjson", "simd"]
categories = ["command-line-utilities", "filesystem", "os::unix-apis"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memchr = "2.7"
bytecount = { version = "0.6", features = ["runtime-dispatch-simd"] }
memmap2 = "0.9"
rayon = "1.10"
jwalk = "0.9"
blake2 = "0.10"
md-5 = { version = "0.10", features = ["asm"] }
digest = "0.10"
base64 = "0.23"
data-encoding = "2.6"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
filetime = "0.2"
unicode-width = "0.2"
anyhow = "1.0"
tempfile = "3.12"
itoa = "1.0"
ring = "0.17"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Every crate opts in with `[lints] workspace = true`. Each `unsafe` block
# carries a `// SAFETY:` comment and is listed in doc/unsafe.md
# (`cargo xtask unsafe-audit` checks the list).
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
