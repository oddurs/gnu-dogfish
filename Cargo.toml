[workspace]
resolver = "2"
members = [
    "crates/dogfish-core",
    "crates/dogfish",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later OR MIT"
authors = ["The GNU/Dogfish Contributors"]
description = "GNU/Dogfish: Libre, high-velocity, object-aware coreutils in Rust"
repository = "https://github.com/oddurs/gnu-dogfish"
homepage = "https://github.com/oddurs/gnu-dogfish"
readme = "README.md"
keywords = ["coreutils", "cli", "unix", "ndjson", "simd"]
categories = ["command-line-utilities", "filesystem", "os::unix-apis"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memchr = "2.7"
bytecount = "0.6"
memmap2 = "0.9"
rayon = "1.10"
jwalk = "0.9"
blake2 = "0.10"
md-5 = { version = "0.10", features = ["asm"] }
digest = "0.10"
base64 = "0.23"
data-encoding = "2.6"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
filetime = "0.2"
unicode-width = "0.2"
anyhow = "1.0"
tempfile = "3.12"
itoa = "1.0"
ring = "0.17"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
