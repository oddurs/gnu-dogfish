[package]
name = "dogfish"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Dogfish: Modern, high-performance, object-aware coreutils in Rust"

[[bin]]
name = "dogfish"
path = "src/main.rs"

# Empty unless the `fuzzing` feature is on: then it exposes the parsers to
# the fuzz targets in `fuzz/` (see src/lib.rs). The binary links it only to
# get build.rs's static unwinder, which Cargo hands to this target alone.
[lib]
name = "dogfish_internal"
path = "src/lib.rs"
doc = false
test = false
doctest = false
bench = false

[features]
fuzzing = []

[dependencies]
dogfish-core = { path = "../dogfish-core", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
memchr.workspace = true
bytecount.workspace = true
memmap2.workspace = true
rayon.workspace = true
jwalk.workspace = true
blake2.workspace = true
md-5.workspace = true
digest.workspace = true
base64.workspace = true
data-encoding.workspace = true
chrono.workspace = true
libc.workspace = true
filetime.workspace = true
unicode-width.workspace = true
anyhow.workspace = true
tempfile.workspace = true
itoa.workspace = true
ring.workspace = true

# md5sum's compression function (crate::common::md5); x86 only.
[target.'cfg(any(target_arch = "x86_64", target_arch = "x86"))'.dependencies]
md5-asm.workspace = true

[dev-dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }

[lints]
workspace = true
